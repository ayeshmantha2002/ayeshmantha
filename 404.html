<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting | Sameera Ayeshmantha</title>
  <script>
    // GitHub Pages SPA router - forwards path to index.html with query parameter
    var path = window.location.pathname.replace(/^\/ayeshmantha\/?/, '').replace(/^\//, '');
    var search = window.location.search;
    var hash = window.location.hash;
    var target = 'index.html' + (path ? '?p=' + encodeURIComponent(path) : '') + (hash ? hash : '');
    window.location.replace(target);
  </script>
</head>
<body style="background:#0b0f19;color:#94a3b8;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Loading Sameera Ayeshmantha Portfolio...</p>
</body>
</html>
